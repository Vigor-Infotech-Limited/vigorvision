[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigorvision"
version = "0.1.0"
description = "Advanced AI vision and object detection framework by Vigor Industries Limited."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }

authors = [
    { name = "Vigor Industries Limited", email = "contact@vigorindustries.com" }
]

# Project URLs
urls = {
    "Homepage" = "https://vigorindustries.com/",
    "Source" = "https://github.com/VigorIndustries/vigorvision",
    "Documentation" = "https://docs.vigorindustries.com/vigorvision",
    "Issues" = "https://github.com/VigorIndustries/vigorvision/issues"
}

# 🔹 Runtime dependencies
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "albumentations>=1.3.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "tensorboard>=2.13.0",
    "wandb>=0.16.0",
]

# 🔹 Optional but very helpful metadata
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

keywords = ["deep-learning", "object-detection", "vision", "AI", "Vigor", "torch", "computer-vision"]

[tool.setuptools]
packages = { find = { include = ["vigorvision*"] } }
include-package-data = true

[tool.setuptools.package-data]
"vigorvision" = ["**/*.yaml", "**/*.cfg", "**/*.txt", "**/*.json"]
